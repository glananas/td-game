<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Defense Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --gold: #fbbf24;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at center, #131b2e 0%, var(--bg) 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Верхняя панель со статами */
    #header {
      width: 92%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stat-badge {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .stat-badge.gold span { color: var(--gold); }
    .stat-badge.hp span { color: var(--danger); }
    .stat-badge.wave span { color: var(--accent); }

    /* Поле игры */
    #canvas-wrap {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), 0 0 15px var(--accent-glow);
      border: 1px solid var(--border);
    }

    canvas {
      display: block;
      background: #0f172a;
    }

    /* Нижние элементы управления */
    #controls {
      width: 92%;
      max-width: 380px;
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.96); filter: brightness(1.2); }

    /* Модальные окна (Обучение / Game Over) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      max-width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rules-list {
      text-align: left;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .rules-list li { margin-bottom: 8px; list-style: none; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <!-- Верхние статы -->
  <div id="header">
    <div class="stat-badge hp">❤️ <span id="lives">15</span></div>
    <div class="stat-badge gold">🟡 <span id="gold">200</span></div>
    <div class="stat-badge wave">⚡ Волна <span id="wave">1</span></div>
  </div>

  <!-- Игровой холст -->
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="360" height="500"></canvas>

    <!-- Окно обучения (How to Play) -->
    <div id="tutorialOverlay" class="overlay">
      <div class="modal-card">
        <h2 class="modal-title">🛡️ Защити Ядро</h2>
        <ul class="rules-list">
          <li><span>📍</span> <b>Жми на круглые платформы</b>, чтобы ставить пушки (стоимость: 100 🟡).</li>
          <li><span>🎯</span> Башни стреляют автоматически по ближайшим целям.</li>
          <li><span>💀</span> Уничтожай врагов, получай золото и удерживай волны!</li>
        </ul>
        <button id="startGameBtn" class="btn">В бой!</button>
      </div>
    </div>

    <!-- Окно Game Over -->
    <div id="gameOverOverlay" class="overlay hidden">
      <div class="modal-card">
        <h2 class="modal-title" id="gameOverTitle">Игра окончена</h2>
        <p style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;">Ты продержался до <span id="finalWave" style="color:var(--accent); font-weight:bold;">1</span> волны!</p>
        <button id="restartGameBtn" class="btn">Играть снова</button>
      </div>
    </div>
  </div>

  <!-- Панель управления снизу -->
  <div id="controls">
    <button id="nextWaveBtn" class="btn">
      <span>▶ Запустить волну</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gold = 200;
    let lives = 15;
    let wave = 1;
    let waveActive = false;

    const path = [
      {x: 40, y: 0},
      {x: 40, y: 130},
      {x: 320, y: 130},
      {x: 320, y: 310},
      {x: 80, y: 310},
      {x: 80, y: 500}
    ];

    const spots = [
      {x: 100, y: 70, tower: null},
      {x: 250, y: 70, tower: null},
      {x: 180, y: 220, tower: null},
      {x: 30, y: 240, tower: null},
      {x: 150, y: 390, tower: null}
    ];

    let enemies = [];
    let projectiles = [];
    let popups = [];

    // Обучение
    document.getElementById('startGameBtn').addEventListener('click', () => {
      document.getElementById('tutorialOverlay').classList.add('hidden');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      startWave();
    });

    document.getElementById('restartGameBtn').addEventListener('click', resetGame);

    // Установка башни
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);

      spots.forEach(spot => {
        const dist = Math.hypot(spot.x - x, spot.y - y);
        if (dist < 28) {
          if (!spot.tower && gold >= 100) {
            gold -= 100;
            spot.tower = { range: 100, damage: 25, cooldown: 25, timer: 0 };
            updateUI();
            addPopup(spot.x, spot.y - 20, "-100 🟡", "#fbbf24");
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          } else if (!spot.tower && gold < 100) {
            addPopup(spot.x, spot.y - 20, "Мало золота!", "#f43f5e");
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
          }
        }
      });
    });

    document.getElementById('nextWaveBtn').addEventListener('click', () => {
      if (!waveActive) startWave();
    });

    function startWave() {
      waveActive = true;
      document.getElementById('nextWaveBtn').disabled = true;
      document.getElementById('nextWaveBtn').style.opacity = '0.5';

      let count = 4 + wave * 2;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          enemies.push({
            x: path[0].x,
            y: path[0].y,
            pathIndex: 0,
            hp: 45 + wave * 20,
            maxHp: 45 + wave * 20,
            speed: 1.3 + (wave * 0.1)
          });
        }, i * 650);
      }
    }

    function addPopup(x, y, text, color) {
      popups.push({ x, y, text, color, life: 30 });
    }

    function resetGame() {
      gold = 200;
      lives = 15;
      wave = 1;
      enemies = [];
      projectiles = [];
      popups = [];
      spots.forEach(s => s.tower = null);
      updateUI();
      document.getElementById('gameOverOverlay').classList.add('hidden');
      startWave();
    }

    function updateUI() {
      document.getElementById('gold').innerText = gold;
      document.getElementById('lives').innerText = lives;
      document.getElementById('wave').innerText = wave;
    }

    function gameOver() {
      document.getElementById('finalWave').innerText = wave;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Рисуем сетку на фоне (кибер-стиль)
      ctx.strokeStyle = "rgba(255,255,255,0.02)";
      ctx.lineWidth = 1;
      for(let x=0; x<canvas.width; x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
      for(let y=0; y<canvas.height; y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

      // Дорожка
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 32;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
      ctx.stroke();

      // Неоновый центр дорожки
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Платформы под башни
      spots.forEach(spot => {
        ctx.fillStyle = spot.tower ? '#0284c7' : '#1e293b';
        ctx.strokeStyle = spot.tower ? '#38bdf8' : '#334155';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(spot.x, spot.y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (spot.tower) {
          // Башня
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(spot.x, spot.y, 7, 0, Math.PI * 2);
          ctx.fill();

          // Логика стрельбы
          spot.tower.timer++;
          if (spot.tower.timer >= spot.tower.cooldown) {
            const target = enemies.find(e => Math.hypot(e.x - spot.x, e.y - spot.y) <= spot.tower.range);
            if (target) {
              projectiles.push({ x: spot.x, y: spot.y, target: target, damage: spot.tower.damage });
              spot.tower.timer = 0;
            }
          }
        } else {
          // Знак плюсика на пустом месте
          ctx.fillStyle = '#64748b';
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('+', spot.x, spot.y);
        }
      });

      // Враги
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const targetPoint = path[e.pathIndex + 1];

        if (targetPoint) {
          const angle = Math.atan2(targetPoint.y - e.y, targetPoint.x - e.x);
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;
          if (Math.hypot(targetPoint.x - e.x, targetPoint.y - e.y) < 3) e.pathIndex++;
        } else {
          enemies.splice(i, 1);
          lives--;
          updateUI();
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
          if (lives <= 0) gameOver();
          continue;
        }

        // Тело врага
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(e.x, e.y, 9, 0, Math.PI * 2);
        ctx.fill();

        // Полоска HP
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 12, e.y - 16, 24, 4);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(e.x - 12, e.y - 16, Math.max(0, (e.hp / e.maxHp) * 24), 4);
      }

      // Снаряды
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        p.x += Math.cos(angle) * 8;
        p.y += Math.sin(angle) * 8;

        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (Math.hypot(p.target.x - p.x, p.target.y - p.y) < 8) {
          p.target.hp -= p.damage;
          if (p.target.hp <= 0) {
            const idx = enemies.indexOf(p.target);
            if (idx > -1) {
              enemies.splice(idx, 1);
              gold += 20;
              updateUI();
              addPopup(p.target.x, p.target.y, "+20 🟡", "#fbbf24");
            }
          }
          projectiles.splice(i, 1);
        }
      }

      // Всплывающие надписи урона/золота
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y -= 0.6;
        pop.life--;
        ctx.fillStyle = pop.color;
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pop.text, pop.x, pop.y);
        if (pop.life <= 0) popups.splice(i, 1);
      }

      // Проверка окончания волны
      if (waveActive && enemies.length === 0) {
        waveActive = false;
        wave++;
        updateUI();
        const btn = document.getElementById('nextWaveBtn');
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = `<span>▶ Волна ${wave}</span>`;
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
