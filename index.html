<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Defense Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #ui {
      width: 100%;
      max-width: 420px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
    }
    .badge { background: #1e293b; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; }
    canvas {
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #334155;
    }
    #controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="ui">
    <div class="badge">❤️ <span id="lives">10</span></div>
    <div class="badge">💰 <span id="gold">150</span></div>
    <div class="badge">🌊 Волна: <span id="wave">1</span></div>
  </div>

  <canvas id="gameCanvas" width="360" height="520"></canvas>

  <div id="controls">
    <button id="nextWaveBtn">Следующая волна</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gold = 150;
    let lives = 10;
    let wave = 1;

    // Путь врагов (координаты X, Y)
    const path = [
      {x: 40, y: 0},
      {x: 40, y: 140},
      {x: 320, y: 140},
      {x: 320, y: 320},
      {x: 100, y: 320},
      {x: 100, y: 520}
    ];

    // Места под башни
    const spots = [
      {x: 100, y: 80, tower: null},
      {x: 240, y: 80, tower: null},
      {x: 180, y: 230, tower: null},
      {x: 40, y: 250, tower: null},
      {x: 170, y: 400, tower: null}
    ];

    let enemies = [];
    let projectiles = [];

    // Покупка башни по тапу
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);

      spots.forEach(spot => {
        const dist = Math.hypot(spot.x - x, spot.y - y);
        if (dist < 25 && !spot.tower && gold >= 100) {
          gold -= 100;
          spot.tower = { range: 90, damage: 20, cooldown: 30, timer: 0 };
          updateUI();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
      });
    });

    document.getElementById('nextWaveBtn').addEventListener('click', () => {
      spawnWave();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    function spawnWave() {
      for (let i = 0; i < 5 + wave * 2; i++) {
        setTimeout(() => {
          enemies.push({
            x: path[0].x,
            y: path[0].y,
            pathIndex: 0,
            hp: 40 + wave * 20,
            maxHp: 40 + wave * 20,
            speed: 1.2 + (wave * 0.1)
          });
        }, i * 700);
      }
      wave++;
      updateUI();
    }

    function updateUI() {
      document.getElementById('gold').innerText = gold;
      document.getElementById('lives').innerText = lives;
      document.getElementById('wave').innerText = wave;
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Отрисовка пути
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 30;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
      ctx.stroke();

      // 2. Места под башни
      spots.forEach(spot => {
        ctx.fillStyle = spot.tower ? '#10b981' : '#475569';
        ctx.beginPath();
        ctx.arc(spot.x, spot.y, 16, 0, Math.PI * 2);
        ctx.fill();

        if (spot.tower) {
          // Логика стрельбы
          spot.tower.timer++;
          if (spot.tower.timer >= spot.tower.cooldown) {
            const target = enemies.find(e => Math.hypot(e.x - spot.x, e.y - spot.y) <= spot.tower.range);
            if (target) {
              projectiles.push({ x: spot.x, y: spot.y, target: target, damage: spot.tower.damage });
              spot.tower.timer = 0;
            }
          }
        }
      });

      // 3. Враги
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const targetPoint = path[e.pathIndex + 1];

        if (targetPoint) {
          const angle = Math.atan2(targetPoint.y - e.y, targetPoint.x - e.x);
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;

          if (Math.hypot(targetPoint.x - e.x, targetPoint.y - e.y) < 2) e.pathIndex++;
        } else {
          enemies.splice(i, 1);
          lives--;
          updateUI();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
          continue;
        }

        // Рендер врага
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(e.x, e.y, 10, 0, Math.PI * 2);
        ctx.fill();

        // Полоска здоровья
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(e.x - 10, e.y - 16, (e.hp / e.maxHp) * 20, 3);
      }

      // 4. Снаряды
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        p.x += Math.cos(angle) * 7;
        p.y += Math.sin(angle) * 7;

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (Math.hypot(p.target.x - p.x, p.target.y - p.y) < 6) {
          p.target.hp -= p.damage;
          if (p.target.hp <= 0) {
            const idx = enemies.indexOf(p.target);
            if (idx > -1) {
              enemies.splice(idx, 1);
              gold += 25;
              updateUI();
            }
          }
          projectiles.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    spawnWave();
    gameLoop();
  </script>
</body>
</html>
